name: Release

# Pushing a vX.Y.Z tag builds the binaries for every supported platform and
# publishes them, with their SHA-256 checksums, as a GitHub Release.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release and upload its assets
      id-token: write # sign the build provenance with a Sigstore certificate
      attestations: write # store the provenance attestation
      artifact-metadata: write # record the attested artifacts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Test
        run: |
          go vet ./...
          go test ./...

      - name: Build
        env:
          VERSION: ${{ github.ref_name }}
          CGO_ENABLED: "0"
        run: |
          set -eu
          commit="$(git rev-parse --short HEAD)"
          build_date="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          ldflags="-s -w -X main.Version=${VERSION} -X main.Commit=${commit} -X main.BuildDate=${build_date}"
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os="${target%/*}"
            arch="${target#*/}"
            name="gitlab-mcp-plus-${os}-${arch}"
            GOOS="$os" GOARCH="$arch" go build -trimpath -ldflags "$ldflags" -o "dist/${name}" .
            (cd dist && sha256sum "$name" > "${name}.sha256")
          done
          ls -l dist

      # Signed SLSA build provenance for each binary, verifiable with
      # `gh attestation verify <file> --repo slackwero/gitlab-mcp-plus`. It runs
      # before publishing, so a failed attestation never ships a release.
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/gitlab-mcp-plus-linux-amd64
            dist/gitlab-mcp-plus-linux-arm64
            dist/gitlab-mcp-plus-darwin-amd64
            dist/gitlab-mcp-plus-darwin-arm64

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/* --verify-tag --title "gitlab-mcp-plus $TAG" --generate-notes
